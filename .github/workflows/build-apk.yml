name: Build APK

# APK는 지금 안 써서 push 때 자동으로 빌드하지 않아요.
# 다시 필요하면 Actions 탭에서 Run workflow 로 수동 실행하거나, 아래 push 줄의 주석을 풀어 주세요.
on:
  # push:
  #   branches: [main, master]
  workflow_dispatch:   # Actions 탭에서 수동 실행

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci
      - run: npx cap sync android

      # 러너에 안드로이드 SDK 가 이미 있어요. 라이선스만 동의 처리
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: 2048-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
