<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#14100e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="2048">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <title>2048 · 12귀월</title>
  <link rel="icon" href="./icon-512.png">
  <link rel="stylesheet" href="./css/theme.css">
  <link rel="stylesheet" href="./css/app.css">
  <link rel="stylesheet" href="./css/game.css">
</head>
<body>

  <!-- 시작할 때 로그인 상태를 확인하는 동안 -->
  <section class="screen screen--boot active" data-screen="boot">
    <div class="wrap home">
      <header class="brand">
        <h1 class="brand__num">2048</h1>
        <p class="brand__sub">불러오는 중</p>
      </header>
    </div>
  </section>

  <!-- 로그인 -->
  <section class="screen screen--login" data-screen="login">
    <div class="wrap home">
      <header class="brand">
        <h1 class="brand__num">2048</h1>
        <p class="brand__sub">12귀월</p>
        <div class="divider"><i></i></div>
      </header>
      <form class="card login" id="loginForm" novalidate>
        <h2>로그인</h2>
        <input class="field" id="loginEmail" type="email" inputmode="email" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="이메일" required>
        <input class="field" id="loginPw" type="password" autocomplete="current-password" placeholder="비밀번호" required>
        <p class="form-err" id="loginErr" role="alert"></p>
        <button class="btn btn--wide" id="loginBtn" type="submit">로그인</button>
      </form>
    </div>
  </section>

  <!-- 홈 -->
  <section class="screen screen--home" data-screen="home">
    <div class="wrap home">
      <header class="brand">
        <h1 class="brand__num">2048</h1>
        <p class="brand__sub">12귀월</p>
        <div class="divider"><i></i></div>
      </header>
      <nav class="menu">
        <button class="menu__btn menu__btn--main" data-go="game">
          <span>게임 시작<small class="menu__sub" id="homeResume" hidden></small></span>
        </button>
        <button class="menu__btn" data-go="profile"><span>프로필</span></button>
        <button class="menu__btn" data-go="shop"><span>꾸미기</span><em class="tag">준비 중</em></button>
      </nav>
      <p class="foot" id="homeHint" hidden>프로필에서 닉네임과 사진을 정해 주세요</p>
    </div>
  </section>

  <!-- 게임 -->
  <section class="screen screen--game" data-screen="game" id="screen-game">
    <div class="topbar">
      <button class="topbar__back" data-back>홈</button>
      <div class="topbar__title">2048</div>
      <div class="topbar__space"></div>
    </div>
    <main class="app">
      <p class="hint">밀어서 같은 숫자를 합쳐요. 2048 을 만들어 보세요!</p>

      <div class="hud">
        <div class="hud__box">점수<b id="score">0</b></div>
        <div class="hud__box">최고 타일<b id="maxTile">-</b></div>
        <div class="hud__box">최고 점수<b id="best">-</b></div>
      </div>

      <div class="board" id="board">
        <div class="board__inner">
          <div class="board__cells" id="cells"></div>
          <div class="board__tiles" id="tiles"></div>
        </div>
      </div>

      <div class="controls">
        <button class="btn" id="undoBtn">↩ 되돌리기 (1)</button>
        <button class="btn btn--sub" id="restartBtn">↻ 새 판</button>
      </div>
    </main>

    <div class="modal" id="modal">
      <div class="modal__card">
        <h2 id="modalTitle">게임 오버</h2>
        <p class="modal__stats" id="modalStats"></p>
        <p class="modal__note" id="modalNote"></p>
        <button class="btn" id="continueBtn" style="display:none;margin-bottom:8px">계속하기</button>
        <button class="btn" id="againBtn">새 판</button>
      </div>
    </div>
  </section>

  <!-- 프로필 (내 기록 포함) -->
  <section class="screen screen--profile" data-screen="profile">
    <div class="topbar">
      <button class="topbar__back" data-back>홈</button>
      <div class="topbar__title">프로필</div>
      <div class="topbar__space"></div>
    </div>
    <div class="wrap">
      <div class="card" id="avatarCard" hidden>
        <h2>프로필 사진</h2>
        <div class="pick" id="avatarPick"></div>
        <p class="form-err" id="avatarMsg" role="status"></p>
      </div>
      <div class="card" id="nickCard" hidden>
        <h2>닉네임</h2>
        <form id="nickForm" novalidate>
          <input class="field" id="nickInput" type="text" maxlength="24" autocomplete="off" placeholder="서로에게 보일 이름 (12글자까지)">
          <p class="form-err" id="nickMsg" role="status"></p>
          <button class="btn btn--wide" id="nickBtn" type="submit">저장</button>
        </form>
      </div>
      <div class="card">
        <h2>내 기록</h2>
        <div class="rows">
          <div class="row">최고 점수<b id="pfBest">-</b></div>
          <div class="row">최고 타일<b id="pfTile">-</b></div>
          <div class="row">플레이 횟수<b id="pfPlays">-</b></div>
        </div>
      </div>
      <div class="card" id="boardCard" hidden>
        <h2>우리 기록</h2>
        <div class="rank" id="rankList"></div>
        <p id="rankMsg"></p>
      </div>
      <div class="card">
        <h2>계정</h2>
        <p id="pfAccount">로그인하면 닉네임을 정하고 서로의 기록을 볼 수 있게 돼요. 지금 기록은 이 기기 안에만 저장돼요.</p>
        <button class="btn btn--sub btn--wide" id="logoutBtn" hidden>로그아웃</button>
      </div>
    </div>
  </section>

  <!-- 꾸미기 -->
  <section class="screen screen--shop" data-screen="shop">
    <div class="topbar">
      <button class="topbar__back" data-back>홈</button>
      <div class="topbar__title">꾸미기</div>
      <div class="topbar__space"></div>
    </div>
    <div class="wrap">
      <div class="card empty">
        <b>준비 중이에요</b>
        <p>타일 모양과 배경을 고를 수 있게 만들 예정이에요.</p>
      </div>
    </div>
  </section>

  <div id="toast"></div>

  <!-- file:// / Android WebView 에서도 열리도록 ES module 을 쓰지 않아요 -->
  <script src="./vendor/firebase/firebase-app-compat.js"></script>
  <script src="./vendor/firebase/firebase-auth-compat.js"></script>
  <script src="./vendor/firebase/firebase-firestore-compat.js"></script>
  <script src="./js/firebase-config.js"></script>
  <script src="./js/auth.js"></script>
  <script src="./js/game.js"></script>
  <script src="./js/cloud.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
