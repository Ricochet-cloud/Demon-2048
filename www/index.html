<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#8b5a3c">
  <title>2048 · 12귀월</title>
  <link rel="icon" href="./icon-512.png">
  <link rel="stylesheet" href="./css/game.css">
</head>
<body>
  <main class="app">
    <h1 class="app__title">🔢 2048</h1>
    <p class="hint">밀어서 같은 숫자를 합쳐요. 2048 을 만들어 보세요!</p>

    <div class="hud">
      <div class="hud__box">점수<b id="score">0</b></div>
      <div class="hud__box">최고 타일<b id="maxTile">-</b></div>
      <div class="hud__box">최고 점수<b id="best">-</b></div>
    </div>

    <div class="board" id="board">
      <div class="board__inner">
        <div class="board__cells" id="cells"></div>
        <div class="board__tiles" id="tiles"></div>
      </div>
    </div>

    <div class="controls">
      <button class="btn" id="undoBtn">↩ 되돌리기 (1)</button>
      <button class="btn btn--sub" id="restartBtn">↻ 새 판</button>
    </div>
  </main>

  <div id="toast"></div>

  <div class="modal" id="modal">
    <div class="modal__card">
      <h2 id="modalTitle">게임 오버</h2>
      <p class="modal__stats" id="modalStats"></p>
      <p class="modal__note" id="modalNote"></p>
      <button class="btn" id="continueBtn" style="display:none;margin-bottom:8px">계속하기</button>
      <button class="btn" id="againBtn">새 판</button>
    </div>
  </div>

  <!-- file:// / Android WebView 에서도 열리도록 ES module 을 쓰지 않아요 -->
  <script src="./js/game.js"></script>
</body>
</html>
